<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Rayane Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-dim: #888888;
            --green: #00FF88;
            --red: #FF4B4B;
            --neutral: #2C2C2E;
            --accent: #007AFF;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .date-display {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .score-badge {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .multipliers {
            display: flex;
            gap: 10px;
            padding: 5px 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .multipliers::-webkit-scrollbar {
            display: none;
        }

        .mult-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .mult-item.active {
            border-color: var(--accent);
            background: rgba(0, 122, 255, 0.1);
        }

        .controls {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .controls::-webkit-scrollbar {
            display: none;
        }

        .preset-btn {
            background: var(--card-bg);
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .preset-btn.active {
            background: var(--text);
            color: var(--bg);
        }

        /* Graph */
        .graph-section {
            padding: 10px 0 0 0;
            border-top: 1px solid var(--border);
            margin-top: 5px;
        }

        .graph-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        canvas#progressGraph {
            width: 100%;
            height: 80px;
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 80px 1fr;
            width: 100%;
            flex-grow: 1;
            /* Allow grid to fill space */
            /* max-width: 600px; REMOVED max-width limit */
            margin: 0;
            /* Remove auto margin since flex handles it */
            position: relative;
        }

        #timeIndicator {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #FFD700, transparent);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
            z-index: 50;
            pointer-events: none;
            display: none;
        }

        #timeIndicator::before {
            content: '';
            position: absolute;
            left: 0;
            top: -3px;
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 10px #FFD700;
        }

        .time-slot {
            padding: 20px 15px;
            text-align: right;
            color: var(--text-dim);
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .task-slot {
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            /* Separation between columns */
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 1rem;
            font-weight: 600;
            min-height: 60px;
            transition: background 0.2s;
        }

        .status-neutral {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
        }

        .status-completed {
            background: var(--green);
            color: #004422;
        }

        .status-failed {
            background: var(--red);
            color: white;
        }

        .task-slot.today-column {
            border-left: 2px solid rgba(255, 215, 0, 0.3);
            border-right: 2px solid rgba(255, 215, 0, 0.3);
        }

        .footer {
            padding: 40px 20px;
            text-align: center;
        }

        .reset-btn {
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(255, 75, 75, 0.2);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
        }

        @keyframes pop {
            0% {
                transform: scale(0.95);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        .pop-anim {
            animation: pop 0.2s forwards;
        }

        /* Layout */
        .main-container {
            display: flex;
            max-width: 1200px;
            /* Increased from 900px */
            /* width: 100%; ensure it can be wide */
            margin: 0 auto;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }

        /* Heatmap */
        .heatmap-container {
            width: max-content;
            /* Only take needed space */
            min-width: 160px;
            flex-shrink: 0;
            position: sticky;
            top: 200px;
        }

        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            /* 16 weeks to cover ~4 months */
            grid-template-rows: repeat(7, 1fr);
            /* 7 days */
            grid-auto-flow: column;
            /* Fill columns first (weeks) */
            gap: 2px;
        }

        .heatmap-cell {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        .heatmap-cell.today {
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.7);
            z-index: 5;
        }

        .heatmap-cell:hover {
            transform: scale(1.5);
            z-index: 10;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .heatmap-labels {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            /* Match heatmap grid 16 weeks */
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-bottom: 5px;
            gap: 2px;
        }

        .heatmap-days {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-right: 5px;
            /* Height = 7 cells * (10px + 2px gap) = ~84px */
        }

        .heatmap-wrapper {
            display: flex;
        }

        /* Multi-day controls */
        .day-count-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 15px;
            /* Separate from date nav */
            background: rgba(255, 255, 255, 0.05);
            /* Subtle background/pill */
            padding: 4px 8px;
            border-radius: 20px;
        }

        .day-count-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .day-count-btn:hover {
            background: var(--blue);
            color: white;
        }

        .day-count-label {
            font-size: 0.85rem;
            color: var(--text);
            min-width: 45px;
            text-align: center;
        }

        /* Dynamic multi-day grid */
        .grid-container.multi-day {
            grid-template-columns: 60px repeat(var(--day-count, 1), 1fr);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-top">
            <div class="nav-controls">
                <button class="nav-btn" onclick="changeDate(-1)">←</button>
                <div class="date-display" id="currentDate">Today</div>
                <button class="nav-btn" onclick="changeDate(1)">→</button>
                <div class="day-count-controls">
                    <button class="day-count-btn" onclick="changeDayCount(-1)">−</button>
                    <span class="day-count-label" id="dayCountLabel">1 day</span>
                    <button class="day-count-btn" onclick="changeDayCount(1)">+</button>
                </div>
            </div>
            <div class="score-badge" id="dailyScore">0%</div>
        </div>

        <div class="multipliers" id="multiplierContainer">
            <div class="mult-item" id="itemMomentum">
                <span>Momentum (1.0x)</span>
            </div>
            <label class="mult-item" id="labelRings">
                <input type="checkbox" id="checkRings" onchange="updateStats()">
                <span>Apple Watch (1.2x)</span>
            </label>
            <label class="mult-item" id="labelWeight">
                <input type="checkbox" id="checkWeight" onchange="updateStats()">
                <span>Weight Target (1.3x)</span>
            </label>
        </div>

        <div class="controls" id="presetContainer"></div>

        <div class="graph-section">
            <div class="graph-label">
                <span>Moving Average (Since Dec 21)</span>
                <span id="currentAvg">0%</span>
            </div>
            <canvas id="progressGraph"></canvas>
        </div>
    </div>

    <div class="main-container">
        <div class="heatmap-container">
            <div class="heatmap-labels" id="heatmapMonthLabels"></div>
            <div class="heatmap-wrapper">
                <div class="heatmap-days">
                    <span>Mon</span>
                    <span></span>
                    <span></span>
                    <span>Thu</span>
                    <span></span>
                    <span></span>
                    <span>Sun</span>
                </div>
                <div class="heatmap-grid" id="heatmapGrid"></div>
            </div>
        </div>

        <div class="grid-container" id="grid">
            <div id="timeIndicator"></div>
        </div>
    </div>

    <div class="footer">
        <button class="reset-btn" onclick="clearDay()">Clear Data for this Day</button>
    </div>

    <script>
        const ACTIVITIES = ["Sleep", "Code", "Work", "Read", "Workout", "Stretch", "Looksmax", "Pray", "Netflix"];
        const START_HOUR = 5;
        const TOTAL_HOURS = 24;
        const SCHEDULE = { 18: "Sleep", 19: "Sleep", 20: "Sleep", 21: "Sleep", 22: "Sleep", 23: "Sleep" };

        const MA_BASE_DATE = new Date(2025, 11, 21); // Dec 21, 2025
        let currentViewDate = new Date();
        currentViewDate.setHours(0, 0, 0, 0);

        let selectedActivity = "Code";
        let dayData = {};
        let dayStats = { momentum: 1, rings: false, weight: false };
        let dayCount = parseInt(localStorage.getItem('rayane_day_count')) || 1;

        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('dailyScore');
        const dateEl = document.getElementById('currentDate');
        const presetContainer = document.getElementById('presetContainer');

        function init() {
            updateDayCountLabel();
            renderPresets();
            updateDisplay();
            renderHeatmap();
            setInterval(updateTimeIndicator, 60000);
        }

        function changeDayCount(delta) {
            dayCount = Math.max(1, Math.min(7, dayCount + delta));
            localStorage.setItem('rayane_day_count', dayCount);
            updateDayCountLabel();
            renderGrid();
            updateTimeIndicator(); // Restore time indicator after grid re-render
        }

        function updateDayCountLabel() {
            const label = document.getElementById('dayCountLabel');
            if (label) label.innerText = dayCount === 1 ? '1 day' : `${dayCount} days`;
        }

        function renderPresets() {
            presetContainer.innerHTML = '';
            ACTIVITIES.forEach(act => {
                const btn = document.createElement('button');
                btn.className = `preset-btn ${act === selectedActivity ? 'active' : ''}`;
                btn.innerText = act;
                btn.onclick = () => {
                    selectedActivity = act;
                    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                presetContainer.appendChild(btn);
            });
        }

        function getDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function updateDisplay() {
            const key = getDateKey(currentViewDate);
            dateEl.innerText = (key === getDateKey(new Date())) ? "Today" : currentViewDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

            const allData = JSON.parse(localStorage.getItem('rayane_tracker_v2')) || {};
            const allStats = JSON.parse(localStorage.getItem('rayane_tracker_stats')) || {};

            if (!allData[key]) {
                allData[key] = {};
                Object.entries(SCHEDULE).forEach(([idx, act]) => {
                    allData[key][idx] = { activity: act, status: 'neutral' };
                });
                localStorage.setItem('rayane_tracker_v2', JSON.stringify(allData));
            }

            dayData = allData[key];
            dayStats = allStats[key] || { rings: false, weight: false };

            document.getElementById('checkRings').checked = dayStats.rings;
            document.getElementById('checkWeight').checked = dayStats.weight;

            // MOMENTUM LOGIC: Average of last 7 days > 50%
            const momentumActive = calculateMomentum(allData, allStats);
            const momentumEl = document.getElementById('itemMomentum');
            if (momentumEl) {
                momentumEl.classList.toggle('active', momentumActive);
                momentumEl.querySelector('span').innerText = momentumActive ? "Momentum Active (1.5x) 🔥" : "Momentum (1.0x)";
            }

            updateMultiplierStyles();
            renderGrid();
            recalculateScore(momentumActive);
            renderProgressGraph(allData, allStats);
            updateTimeIndicator();
        }

        function updateTimeIndicator() {
            const indicator = document.getElementById('timeIndicator');
            if (!indicator) return;

            const now = new Date();
            // Check if "Today" is visible in the current view
            // currentViewDate is the start. We show dayCount days.
            const todayKey = getDateKey(now);
            let todayIndex = -1;

            for (let d = 0; d < dayCount; d++) {
                const targetDate = new Date(currentViewDate);
                targetDate.setDate(targetDate.getDate() + d);
                if (getDateKey(targetDate) === todayKey) {
                    todayIndex = d;
                    break;
                }
            }

            if (todayIndex === -1) {
                indicator.style.display = 'none';
                return;
            }

            const hoursSinceStart = (now.getHours() + now.getMinutes() / 60 - START_HOUR + 24) % 24;
            const totalHeight = gridEl.scrollHeight;
            const rowHeight = totalHeight / TOTAL_HOURS;
            const topOffset = hoursSinceStart * rowHeight;

            // Calculate horizontal position
            // Grid: 80px time col + (dayCount * 1fr) for days
            // We need to match the specific 1fr column width
            // Since we can't easily get 1fr in px, we can use calc() or percentage if the container is fixed.
            // Better: offsetLeft of a cell in that column?
            // Let's assume uniform width: (100% - 80px) / dayCount

            indicator.style.display = 'block';
            indicator.style.top = `${topOffset}px`;
            indicator.style.left = `calc(80px + ((100% - 80px) / ${dayCount}) * ${todayIndex})`;
            indicator.style.width = `calc((100% - 80px) / ${dayCount})`;
        }

        function renderProgressGraph(allData, allStats) {
            const canvas = document.getElementById('progressGraph');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            // Graph Settings
            const w = rect.width;
            const h = rect.height;
            const paddingX = 15;
            const paddingY = 10;
            const chartW = w - paddingX * 2;
            const chartH = h - paddingY * 2;

            // Scan all available data keys and sort them
            const allKeys = Object.keys(allData)
                .filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)) // Valid date keys only
                .sort(); // Chronological order

            if (allKeys.length === 0) {
                document.getElementById('currentAvg').innerText = "0%";
                ctx.clearRect(0, 0, w, h);
                return;
            }

            // Find the date range
            const chartStart = new Date(allKeys[0]);
            const chartEnd = new Date(allKeys[allKeys.length - 1]);
            chartStart.setHours(0, 0, 0, 0);
            chartEnd.setHours(0, 0, 0, 0);

            const daysToShow = Math.floor((chartEnd - chartStart) / (1000 * 60 * 60 * 24)) + 1;

            const points = [];
            let cumulativeSum = 0;
            let cumulativeCount = 0;
            let latestAvg = 0;

            // Iterate through EVERY day from chartStart to chartEnd
            for (let i = 0; i < daysToShow; i++) {
                const targetDate = new Date(chartStart);
                targetDate.setDate(targetDate.getDate() + i);
                const k = getDateKey(targetDate);

                // Calculate day's score (0 if no data)
                let dayScore = 0;
                if (allData[k]) {
                    const slots = Object.values(allData[k]);
                    const done = slots.filter(s => s.status === 'done').length;
                    dayScore = (done / TOTAL_HOURS);
                    const st = allStats[k] || {};
                    if (st.rings) dayScore *= 1.2;
                    if (st.weight) dayScore *= 1.3;
                }

                // Add to running total
                cumulativeSum += dayScore;
                cumulativeCount++;
                const avg = cumulativeSum / cumulativeCount;
                points.push({ x: i, y: avg });
                latestAvg = avg;
            }

            document.getElementById('currentAvg').innerText = Math.round(latestAvg * 100) + "%";

            ctx.clearRect(0, 0, w, h);

            // Grid lines (y-axis)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = paddingY + (chartH * (i / 4));
                ctx.beginPath();
                ctx.moveTo(paddingX, y);
                ctx.lineTo(w - paddingX, y);
                ctx.stroke();
            }

            // Safeguard: Ensure we don't divide by zero when there's only 1 day
            const xDivisor = Math.max(daysToShow - 1, 1);

            // Month Labels
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.font = '10px Inter';
            ctx.textAlign = 'center';
            const months = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
            let lastLabelMonth = -1;
            for (let i = 0; i < daysToShow; i++) {
                const d = new Date(chartStart);
                d.setDate(d.getDate() + i);
                if (d.getMonth() !== lastLabelMonth) {
                    const x = paddingX + (i * (chartW / xDivisor));
                    ctx.fillText(months[d.getMonth()], x, h - 2);
                    lastLabelMonth = d.getMonth();
                }
            }

            if (points.length === 0) return;

            // Draw vertical separation lines FIRST (so they don't interrupt the main line)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            points.forEach((p) => {
                const x = paddingX + (p.x * (chartW / xDivisor));
                ctx.beginPath();
                ctx.moveTo(x, paddingY);
                ctx.lineTo(x, h - paddingY);
                ctx.stroke();
            });

            // Draw the main progress line
            ctx.beginPath();
            ctx.strokeStyle = '#007AFF';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            points.forEach((p, idx) => {
                const x = paddingX + (p.x * (chartW / xDivisor));
                const y = paddingY + chartH - (Math.min(p.y, 1.2) * chartH); // Cap at 120%
                if (idx === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Gradient Fill
            const grad = ctx.createLinearGradient(0, paddingY, 0, h - paddingY);
            grad.addColorStop(0, 'rgba(0, 122, 255, 0.15)');
            grad.addColorStop(1, 'rgba(0, 122, 255, 0)');
            ctx.lineTo(paddingX + (points[points.length - 1].x * (chartW / xDivisor)), h - paddingY);
            ctx.lineTo(paddingX + (points[0].x * (chartW / xDivisor)), h - paddingY);
            ctx.fillStyle = grad;
            ctx.fill();

            // Latest Point dot
            const lastP = points[points.length - 1];
            const lastX = paddingX + (lastP.x * (chartW / xDivisor));
            const lastY = paddingY + chartH - (Math.min(lastP.y, 1.2) * chartH);
            ctx.fillStyle = '#007AFF';
            ctx.beginPath();
            ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function calculateMomentum(allData, allStats) {
            let totalPercent = 0;
            let daysCount = 0;

            for (let i = 1; i <= 7; i++) {
                const d = new Date(currentViewDate);
                d.setDate(d.getDate() - i);
                const k = getDateKey(d);

                if (allData[k]) {
                    const slots = Object.values(allData[k]);
                    const done = slots.filter(s => s.status === 'done').length;
                    let dailyScore = (done / TOTAL_HOURS);

                    const stats = allStats[k] || {};
                    if (stats.rings) dailyScore *= 1.2;
                    if (stats.weight) dailyScore *= 1.3;

                    totalPercent += dailyScore;
                    daysCount++;
                }
            }

            if (daysCount === 0) return false;
            return (totalPercent / daysCount) > 0.5;
        }

        function updateMultiplierStyles() {
            document.getElementById('labelRings').classList.toggle('active', dayStats.rings);
            document.getElementById('labelWeight').classList.toggle('active', dayStats.weight);
        }

        function renderGrid() {
            gridEl.innerHTML = '';

            // Set dynamic columns for multi-day
            gridEl.style.setProperty('--day-count', dayCount);
            if (dayCount > 1) {
                gridEl.classList.add('multi-day');
            } else {
                gridEl.classList.remove('multi-day');
            }

            // Re-create time indicator since innerHTML cleared it
            const indicatorVal = document.createElement('div');
            indicatorVal.id = 'timeIndicator';
            gridEl.appendChild(indicatorVal);

            const allData = JSON.parse(localStorage.getItem('rayane_tracker_v2')) || {};

            for (let i = 0; i < TOTAL_HOURS; i++) {
                const hour = (START_HOUR + i) % 24;
                const suffix = hour >= 12 ? 'PM' : 'AM';
                const dispH = hour % 12 || 12;

                const tDiv = document.createElement('div');
                tDiv.className = 'time-slot';
                tDiv.innerText = `${dispH} ${suffix}`;
                gridEl.appendChild(tDiv);

                // Render slots for each day
                for (let d = 0; d < dayCount; d++) {
                    const targetDate = new Date(currentViewDate);
                    targetDate.setDate(targetDate.getDate() + d);
                    const dayKey = getDateKey(targetDate);
                    const dayDataForSlot = allData[dayKey] || {};

                    const slot = document.createElement('div');
                    slot.className = 'task-slot';

                    // Highlight Today column
                    const nowKey = getDateKey(new Date());
                    if (dayKey === nowKey) {
                        slot.classList.add('today-column');
                    }

                    const saved = dayDataForSlot[i];
                    if (saved) {
                        slot.innerText = saved.activity;
                        if (saved.status === 'neutral') slot.classList.add('status-neutral');
                        if (saved.status === 'done') slot.classList.add('status-completed');
                        if (saved.status === 'fail') slot.classList.add('status-failed');
                    }
                    slot.onclick = () => handleSlotClickMulti(slot, i, dayKey);
                    gridEl.appendChild(slot);
                }
            }
        }

        function handleSlotClick(el, index) {
            handleSlotClickMulti(el, index, getDateKey(currentViewDate));
        }

        function handleSlotClickMulti(el, index, dayKey) {
            let status = 'empty';
            if (el.classList.contains('status-neutral')) status = 'neutral';
            else if (el.classList.contains('status-completed')) status = 'done';
            else if (el.classList.contains('status-failed')) status = 'fail';

            el.classList.remove('status-neutral', 'status-completed', 'status-failed', 'pop-anim');
            void el.offsetWidth;
            el.classList.add('pop-anim');

            const allData = JSON.parse(localStorage.getItem('rayane_tracker_v2')) || {};
            if (!allData[dayKey]) allData[dayKey] = {};

            if (status === 'empty') {
                el.innerText = selectedActivity;
                el.classList.add('status-neutral');
                allData[dayKey][index] = { activity: selectedActivity, status: 'neutral' };
            } else if (status === 'neutral') {
                el.classList.add('status-completed');
                allData[dayKey][index] = { activity: el.innerText, status: 'done' };
            } else if (status === 'done') {
                el.classList.add('status-failed');
                allData[dayKey][index] = { activity: el.innerText, status: 'fail' };
            } else {
                el.innerText = "";
                delete allData[dayKey][index];
            }

            localStorage.setItem('rayane_tracker_v2', JSON.stringify(allData));
            dayData = allData[getDateKey(currentViewDate)] || {};

            const allStats = JSON.parse(localStorage.getItem('rayane_tracker_stats')) || {};
            const momentumActive = calculateMomentum(allData, allStats);
            recalculateScore(momentumActive);
            renderProgressGraph(allData, allStats);
            renderHeatmap();
        }

        function renderHeatmap() {
            const heatmapEl = document.getElementById('heatmapGrid');
            const labelsEl = document.getElementById('heatmapMonthLabels');
            if (!heatmapEl || !labelsEl) return;

            heatmapEl.innerHTML = '';
            labelsEl.innerHTML = '';

            const allData = JSON.parse(localStorage.getItem('rayane_tracker_v2')) || {};
            const allStats = JSON.parse(localStorage.getItem('rayane_tracker_stats')) || {};

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Calculate start date: Go back to the nearest Monday 12 weeks ago
            const weeksToShow = 16; // Extend to cover ~4 months
            const daysToShow = weeksToShow * 7;
            const startDate = new Date(today);
            // Adjust to start on a Monday (if today is Sunday(0), go back 6 days. Else back day-1)
            const dayOfWeek = startDate.getDay();
            const diffToMon = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
            startDate.setDate(startDate.getDate() - diffToMon - (weeksToShow * 7) + 7);
            // The logic above tries to show exactly N weeks ending near today. 
            // Let's simplify: Start 11 weeks ago Monday, end this week Sunday.

            // Actually, GitHub graph usually ends today. 
            // So let's just render 12 columns (weeks). 
            // Column 1 is 11 weeks ago. Column 12 is this week.

            // Reset start date logic:
            // Find "This Week's Monday"
            const currentMon = new Date(today);
            const d = currentMon.getDay();
            const diff = d === 0 ? 6 : d - 1;
            currentMon.setDate(currentMon.getDate() - diff); // This Monday

            // Start date = This Monday (Current week)
            const startRenderDate = new Date(currentMon);

            let lastMonthLabel = -1;

            // Loop 16 weeks
            for (let w = 0; w < 16; w++) {
                // Check for month label on the first week of a month
                const weekDate = new Date(startRenderDate);
                weekDate.setDate(weekDate.getDate() + (w * 7));

                const label = document.createElement('span');
                // Only show label if month changes, OR if it's the first column
                // AND don't spam labels if weeks are in same month
                if (weekDate.getMonth() !== lastMonthLabel) {
                    label.innerText = weekDate.toLocaleDateString('en-US', { month: 'short' });
                    lastMonthLabel = weekDate.getMonth();
                } else {
                    label.innerText = ""; // Spacer
                }
                labelsEl.appendChild(label);

                // Loop 7 days (Mon-Sun)
                for (let d = 0; d < 7; d++) {
                    const cellDate = new Date(startRenderDate);
                    cellDate.setDate(cellDate.getDate() + (w * 7) + d);
                    const k = getDateKey(cellDate);

                    const cell = document.createElement('div');
                    cell.className = 'heatmap-cell';

                    // Highlight today
                    const todayKey = getDateKey(today);
                    if (k === todayKey) {
                        cell.classList.add('today');
                    }

                    // Logic: Hide past data. Only show coloring for TODAY onwards.
                    let score = 0;
                    // Only fetch score if date is >= today (normalized)
                    if (cellDate >= today) {
                        score = getScore(k, allData, allStats);
                        cell.title = `${cellDate.toLocaleDateString()} - ${Math.round(score * 100)}%`;
                    } else {
                        // For past days shown in the grid, show them as dim empty cells
                        cell.title = `${cellDate.toLocaleDateString()} (Past)`;
                        cell.style.opacity = '0.2';
                        cell.style.cursor = 'default';
                        // Optional: disable click for past days if desired, but keeping enabled for now
                    }

                    // Color gradient logic (only for >= today with score > 0)
                    if (score > 0) {
                        // Using HSL: Green is 120, Red is 0.
                        // User wants 24 colors. Let's go Red -> Yellow -> Green.
                        // Hue moves from 0 (Red) to 120 (Green).
                        const hue = Math.round(score * 120);

                        // Saturation 70%, Lightness 50% for visibility
                        // Or use opacity on green? User asked for 24 distinct colors. Hue shift is best.
                        cell.style.background = `hsl(${hue}, 75%, 45%)`;
                    }

                    cell.onclick = () => {
                        currentViewDate = new Date(cellDate);
                        updateDisplay();
                    };

                    heatmapEl.appendChild(cell);
                }
            }
        }

        function getScore(key, allData, allStats) {
            if (allData[key]) {
                const slots = Object.values(allData[key]);
                const done = slots.filter(s => s.status === 'done').length;
                let score = done / TOTAL_HOURS;
                const st = allStats[key] || {};
                if (st.rings) score *= 1.2;
                if (st.weight) score *= 1.3;
                return Math.min(score, 1);
            }
            return 0;
        }

        function saveSlot(index, activity, status) {
            const key = getDateKey(currentViewDate);
            const allData = JSON.parse(localStorage.getItem('rayane_tracker_v2')) || {};
            if (!allData[key]) allData[key] = {};
            if (status === 'empty') delete allData[key][index];
            else allData[key][index] = { activity, status };
            dayData = allData[key];
            localStorage.setItem('rayane_tracker_v2', JSON.stringify(allData));
        }

        function updateStats() {
            dayStats.rings = document.getElementById('checkRings').checked;
            dayStats.weight = document.getElementById('checkWeight').checked;

            const key = getDateKey(currentViewDate);
            const allStats = JSON.parse(localStorage.getItem('rayane_tracker_stats')) || {};
            allStats[key] = dayStats;
            localStorage.setItem('rayane_tracker_stats', JSON.stringify(allStats));

            updateDisplay();
        }

        function recalculateScore(momentumActive) {
            const slots = Object.values(dayData);
            const done = slots.filter(s => s.status === 'done').length;
            let score = (done / TOTAL_HOURS);

            if (momentumActive) score *= 1.5;
            if (dayStats.rings) score *= 1.2;
            if (dayStats.weight) score *= 1.3;

            const percent = Math.round(score * 100);
            scoreEl.innerText = percent + "%";
            scoreEl.style.color = (percent >= 80) ? "var(--green)" : (percent >= 50 ? "white" : "var(--red)");
        }

        function changeDate(days) {
            currentViewDate.setDate(currentViewDate.getDate() + days);
            updateDisplay();
        }

        function clearDay() {
            const key = getDateKey(currentViewDate);
            const allData = JSON.parse(localStorage.getItem('rayane_tracker_v2')) || {};
            const allStats = JSON.parse(localStorage.getItem('rayane_tracker_stats')) || {};

            // Remove day-specific data
            delete allStats[key];
            delete allData[key];

            // Save updates
            localStorage.setItem('rayane_tracker_v2', JSON.stringify(allData));
            localStorage.setItem('rayane_tracker_stats', JSON.stringify(allStats));

            // Refresh UI without reloading page (preserves currentViewDate)
            updateDisplay();
            renderHeatmap();
        }

        init();
    </script>
</body>
