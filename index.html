<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rayane Tracker">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <title>Rayane Tracker</title>
    <meta name="theme-color" content="#08080A">
    <!-- No webfont: the system stack is SF Pro on iPad/iPhone/Mac, so the app
         renders identically offline and skips a render-blocking request. -->
    <style>
        /* ─── Design tokens ───────────────────────────────────────────────
           Everything below picks from these. Sizes, radii and spacing used to
           be chosen per-component by eye: 12 font sizes and 8 radii on a single
           screen, which is most of why nothing lined up. */
        :root {
            --bg: #08080A;
            --surface: #121215;
            --surface-2: #1B1B20;

            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);

            --text: #F5F5F7;
            --text-2: #A1A1AA;
            --text-3: #6E6E78;

            /* Apple's dark-mode system colours: saturated enough to read as a
               signal, calm enough not to shout over everything else. */
            --accent: #0A84FF;
            --green: #30D158;
            --red: #FF453A;
            --amber: #FFD60A;

            /* Solid status fills for the day grid. Turn the saturation down
               here if the wall of colour gets loud — nothing else depends on
               these two. */
            --fill-green: #00E57A;
            --fill-red: #FF4B4B;

            /* Type scale */
            --fs-xs: 0.6875rem;
            --fs-sm: 0.8125rem;
            --fs-md: 0.9375rem;
            --fs-lg: 1.25rem;
            --fs-xl: 2.125rem;

            /* Spacing scale */
            --sp-1: 4px;
            --sp-2: 8px;
            --sp-3: 12px;
            --sp-4: 16px;
            --sp-5: 24px;
            --sp-6: 32px;

            /* Radii */
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-full: 999px;

            --row-h: 46px;
            --time-col: 68px;
            --content-max: 880px;
            --heat-cell: 13px;
            --heat-gap: 3px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            /* System stack: SF Pro on iPad/iPhone/Mac. Reads native, needs no
               network request, and looks identical offline. */
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
            font-size: var(--fs-md);
            line-height: 1.4;
            margin: 0;
            padding: 0 0 var(--sp-6);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            transition: margin-left 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        }

        body.sidebar-visible {
            margin-left: 288px;
        }

        button {
            font-family: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ─── Header ──────────────────────────────────────────────────────── */
        .header {
            position: sticky;
            top: 0;
            background: rgba(8, 8, 10, 0.72);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: var(--sp-3) var(--sp-4);
            display: flex;
            flex-direction: column;
            gap: var(--sp-3);
        }

        .header-inner {
            width: 100%;
            max-width: var(--content-max);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--sp-3);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--sp-3);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            min-width: 0;
        }

        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-2);
            width: 34px;
            height: 34px;
            border-radius: var(--r-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .nav-btn:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .date-display {
            font-size: var(--fs-md);
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
            padding: 0 var(--sp-1);
        }

        .date-display .date-today {
            color: var(--accent);
        }

        .score-badge {
            font-size: var(--fs-xl);
            font-weight: 700;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            flex-shrink: 0;
        }

        /* ─── Day count stepper ───────────────────────────────────────────── */
        .day-count-controls {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 3px;
            border-radius: var(--r-full);
            flex-shrink: 0;
        }

        .day-count-btn {
            background: transparent;
            border: none;
            color: var(--text-2);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: var(--fs-md);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .day-count-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .day-count-label {
            font-size: var(--fs-xs);
            color: var(--text-2);
            min-width: 44px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ─── Chips: multipliers + activity presets ───────────────────────── */
        .multipliers,
        .controls {
            display: flex;
            gap: var(--sp-2);
            overflow-x: auto;
            scrollbar-width: none;
            /* Fade the right edge so it reads as scrollable rather than cut off */
            -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
            mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
            padding-right: var(--sp-2);
        }

        .multipliers::-webkit-scrollbar,
        .controls::-webkit-scrollbar {
            display: none;
        }

        .mult-item {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            background: var(--surface);
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--r-sm);
            border: 1px solid var(--border);
            font-size: var(--fs-sm);
            color: var(--text-2);
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }

        .mult-item input {
            accent-color: var(--accent);
            width: 15px;
            height: 15px;
            margin: 0;
        }

        .mult-item.active {
            border-color: rgba(10, 132, 255, 0.5);
            background: rgba(10, 132, 255, 0.12);
            color: var(--text);
        }

        .preset-btn {
            background: var(--surface);
            color: var(--text-2);
            border: 1px solid var(--border);
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .preset-btn:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        .preset-btn.active {
            background: var(--text);
            border-color: var(--text);
            color: var(--bg);
            font-weight: 600;
        }

        /* ─── Chart ───────────────────────────────────────────────────────── */
        .graph-section {
            border-top: 1px solid var(--border);
            padding-top: var(--sp-3);
        }

        .graph-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--sp-3);
            margin-bottom: var(--sp-2);
        }

        .graph-title {
            font-size: var(--fs-xs);
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        .graph-value {
            font-size: var(--fs-md);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .graph-window-selectors {
            display: flex;
            gap: 2px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 2px;
        }

        .window-btn {
            background: transparent;
            border: none;
            color: var(--text-3);
            padding: var(--sp-1) var(--sp-2);
            border-radius: 6px;
            font-size: var(--fs-xs);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .window-btn:hover {
            color: var(--text-2);
        }

        .window-btn.active {
            background: var(--surface-2);
            color: var(--text);
        }

        canvas#progressGraph {
            width: 100%;
            height: 68px;
            display: block;
        }

        /* ─── Main layout ─────────────────────────────────────────────────── */
        .main-container {
            width: 100%;
            max-width: var(--content-max);
            margin: 0 auto;
            padding: var(--sp-5) var(--sp-4) 0;
            display: flex;
            flex-direction: column;
            gap: var(--sp-5);
        }

        /* ─── Heatmap ─────────────────────────────────────────────────────── */
        .heatmap-container {
            display: flex;
            flex-direction: column;
            /* Share the grid's left edge — a centred block beside a left-aligned
               grid was the main thing still reading as unaligned. */
            align-items: flex-start;
            gap: var(--sp-1);
        }

        .heatmap-scroll {
            max-width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .heatmap-scroll::-webkit-scrollbar {
            display: none;
        }

        .heatmap-inner {
            display: inline-flex;
            flex-direction: column;
            gap: var(--heat-gap);
            align-items: flex-start;
        }

        /* Label columns must be the same fixed track as the cells. As 1fr they
           sized against a different container and drifted right of the month
           they were labelling. Overflow is deliberate — the text spills past
           its 13px column, like GitHub's contribution graph. */
        .heatmap-labels {
            display: grid;
            grid-auto-columns: var(--heat-cell);
            grid-auto-flow: column;
            gap: var(--heat-gap);
            font-size: var(--fs-xs);
            color: var(--text-3);
            margin-left: calc(26px + var(--heat-gap));
            height: 1.1em;
        }

        .heatmap-labels span {
            white-space: nowrap;
            overflow: visible;
        }

        .heatmap-wrapper {
            display: flex;
            gap: var(--heat-gap);
        }

        .heatmap-days {
            display: grid;
            grid-template-rows: repeat(7, var(--heat-cell));
            gap: var(--heat-gap);
            font-size: var(--fs-xs);
            color: var(--text-3);
            width: 26px;
            text-align: right;
        }

        .heatmap-days span {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            line-height: 1;
        }

        .heatmap-grid {
            display: grid;
            grid-template-rows: repeat(7, var(--heat-cell));
            grid-auto-columns: var(--heat-cell);
            grid-auto-flow: column;
            gap: var(--heat-gap);
        }

        .heatmap-cell {
            width: var(--heat-cell);
            height: var(--heat-cell);
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.055);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        /* Five steps of one hue, matching the grid's "done" green. */
        .heatmap-cell.level-1 { background: rgba(0, 229, 122, 0.22); }
        .heatmap-cell.level-2 { background: rgba(0, 229, 122, 0.40); }
        .heatmap-cell.level-3 { background: rgba(0, 229, 122, 0.58); }
        .heatmap-cell.level-4 { background: rgba(0, 229, 122, 0.78); }
        .heatmap-cell.level-5 { background: var(--fill-green); }

        .heatmap-cell.today {
            box-shadow: 0 0 0 1.5px var(--amber);
        }

        .heatmap-cell.future {
            opacity: 0.3;
            cursor: default;
        }

        .heatmap-cell:hover {
            transform: scale(1.35);
        }

        /* ─── Day grid ────────────────────────────────────────────────────── */
        .grid-container {
            display: grid;
            grid-template-columns: var(--time-col) 1fr;
            width: 100%;
            position: relative;
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            overflow: hidden;
            background: var(--surface);
        }

        .grid-container.multi-day {
            grid-template-columns: var(--time-col) repeat(var(--day-count, 1), 1fr);
        }

        #timeIndicator {
            position: absolute;
            height: 1.5px;
            background: var(--amber);
            z-index: 50;
            pointer-events: none;
            display: none;
        }

        #timeIndicator::before {
            content: '';
            position: absolute;
            left: 0;
            top: -3px;
            width: 7px;
            height: 7px;
            background: var(--amber);
            border-radius: 50%;
        }

        .time-slot {
            padding: 0 var(--sp-2);
            text-align: right;
            color: var(--text-3);
            font-size: var(--fs-xs);
            font-variant-numeric: tabular-nums;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: var(--row-h);
        }

        .task-slot {
            padding: 0 var(--sp-3);
            border-bottom: 1px solid var(--border);
            border-left: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: var(--fs-sm);
            height: var(--row-h);
            transition: background 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .task-slot:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .task-slot-content {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            min-width: 0;
            padding-right: var(--sp-5);
        }

        .task-slot-content span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Solid fills: the whole cell takes the status colour. */
        .status-neutral {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 3px 0 0 var(--text-3);
            color: var(--text-2);
        }

        .status-completed {
            background: var(--fill-green);
            color: #00351C;
        }

        .status-failed {
            background: var(--fill-red);
            color: #fff;
        }

        .status-completed .task-slot-content span,
        .status-failed .task-slot-content span {
            font-weight: 600;
        }

        /* Neither fill needs a hover wash on top of it */
        .task-slot.status-completed:hover,
        .task-slot.status-failed:hover {
            background: var(--fill-green);
        }

        .task-slot.status-failed:hover {
            background: var(--fill-red);
        }

        /* Only tint today's *empty* cells — this selector outranks the status
           rules, so unscoped it would paint over the green and red fills. */
        .task-slot.today-column:not(.status-neutral):not(.status-completed):not(.status-failed) {
            background: rgba(255, 214, 10, 0.04);
        }

        .task-slot-delete {
            position: absolute;
            top: 50%;
            right: var(--sp-2);
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .task-slot-delete:hover {
            background: var(--red);
            color: #fff;
        }

        /* A pale chip vanishes on a saturated fill — scrim it instead. */
        .status-completed .task-slot-delete,
        .status-failed .task-slot-delete {
            background: rgba(0, 0, 0, 0.22);
            color: inherit;
        }

        .status-completed .task-slot-delete:hover,
        .status-failed .task-slot-delete:hover {
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
        }

        /* 24 permanently visible ✕ circles was a lot of noise. Reveal on hover
           where there's a pointer; keep them faint but reachable on touch. */
        @media (hover: hover) {
            .task-slot-delete {
                opacity: 0;
            }

            .task-slot:hover .task-slot-delete {
                opacity: 1;
            }
        }

        @media (hover: none) {
            .task-slot-delete {
                opacity: 0.35;
            }
        }

        @keyframes pop {
            0% { transform: scale(0.97); }
            60% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }

        .pop-anim {
            animation: pop 0.18s ease-out;
        }

        /* ─── Footer ──────────────────────────────────────────────────────── */
        .footer {
            max-width: var(--content-max);
            margin: 0 auto;
            padding: var(--sp-6) var(--sp-4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--sp-3);
        }

        .footer-actions {
            display: flex;
            gap: var(--sp-2);
            flex-wrap: wrap;
            justify-content: center;
        }

        .app-version {
            color: var(--text-3);
            font-size: var(--fs-xs);
        }

        .reset-btn {
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--border);
            padding: var(--sp-2) var(--sp-4);
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .reset-btn:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        .reset-btn.danger:hover {
            border-color: var(--red);
            color: var(--red);
        }

        /* ─── Sidebar ─────────────────────────────────────────────────────── */
        .task-sidebar {
            position: fixed;
            left: -288px;
            top: 0;
            width: 288px;
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: var(--sp-4);
            overflow-y: auto;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: var(--sp-3);
            transition: left 0.28s cubic-bezier(0.32, 0.72, 0, 1);
            visibility: hidden;
        }

        .task-sidebar.visible {
            left: 0;
            visibility: visible;
        }

        .task-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: var(--fs-md);
            font-weight: 600;
        }

        .task-sidebar-close {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-2);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .task-sidebar-close:hover {
            color: var(--text);
            background: var(--border);
        }

        .task-sidebar-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-2);
            width: 34px;
            height: 34px;
            border-radius: var(--r-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .task-sidebar-toggle:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .task-scrim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }

        body.sidebar-visible .task-scrim {
            opacity: 1;
            pointer-events: auto;
        }

        .task-add-section {
            display: flex;
            gap: var(--sp-2);
        }

        .task-add-input {
            flex: 1;
            min-width: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            font-family: inherit;
        }

        .task-add-input::placeholder {
            color: var(--text-3);
        }

        .task-add-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .task-add-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: var(--fs-sm);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: var(--sp-1);
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--sp-2);
            padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
        }

        .task-item:hover {
            border-color: var(--border-strong);
        }

        .task-item-name {
            flex: 1;
            min-width: 0;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-item-name.protected {
            cursor: default;
            color: var(--text-3);
        }

        .task-item-actions {
            display: flex;
            gap: var(--sp-1);
            flex-shrink: 0;
        }

        .task-item-btn {
            background: transparent;
            border: none;
            color: var(--text-3);
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .task-item-btn.delete:hover {
            background: rgba(255, 69, 58, 0.15);
            color: var(--red);
        }

        .task-hint {
            font-size: var(--fs-xs);
            color: var(--text-3);
            margin-top: auto;
            padding-top: var(--sp-3);
        }

        .task-error-msg {
            background: rgba(255, 69, 58, 0.12);
            border: 1px solid rgba(255, 69, 58, 0.3);
            color: var(--red);
            padding: var(--sp-2) var(--sp-3);
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            display: none;
        }

        .task-error-msg.show {
            display: block;
        }

        /* ─── Tablet (iPad) ───────────────────────────────────────────────── */
        @media (max-width: 1180px) {
            :root {
                --content-max: 760px;
            }
        }

        /* ─── Phone ───────────────────────────────────────────────────────── */
        @media (max-width: 768px) {
            :root {
                --row-h: 44px;
                --time-col: 56px;
                --fs-xl: 1.75rem;
            }

            .header {
                padding: var(--sp-2) var(--sp-3);
                gap: var(--sp-2);
            }

            .header-inner {
                gap: var(--sp-2);
            }

            .main-container {
                padding: var(--sp-4) var(--sp-2) 0;
                gap: var(--sp-4);
            }

            .grid-container {
                border-radius: var(--r-md);
            }

            :root {
                --heat-cell: 11px;
            }

            .date-display {
                font-size: var(--fs-sm);
            }

            .day-count-label {
                min-width: 38px;
            }

            /* At 390px the stepper collided with the score badge. Let it wrap
               to its own line rather than hiding it, so a multi-day view set on
               the iPad can still be dialled back on the phone. */
            .header-top {
                flex-wrap: wrap;
                row-gap: var(--sp-2);
            }

            .nav-controls {
                flex-wrap: wrap;
                row-gap: var(--sp-2);
                flex: 1;
            }

            /* Pushing the body 288px sideways moved the app off a 390px screen. */
            body.sidebar-visible {
                margin-left: 0;
                overflow: hidden;
            }

            .task-sidebar {
                width: 84vw;
                max-width: 288px;
                left: -84vw;
            }

            .task-sidebar.visible {
                left: 0;
            }

            .footer {
                padding: var(--sp-5) var(--sp-3);
            }

            .reset-btn {
                flex: 1;
                min-width: 140px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Task Management Sidebar -->
    <div class="task-sidebar" id="taskSidebar">
        <div class="task-sidebar-header">
            <span>Activities</span>
            <button class="task-sidebar-close" onclick="closeMobileSidebar()" aria-label="Close activities">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="task-add-section">
            <input type="text" class="task-add-input" id="taskAddInput" placeholder="New activity">
            <button class="task-add-btn" onclick="addTaskFromInput()">Add</button>
        </div>
        <div class="task-error-msg" id="taskErrorMsg"></div>
        <div class="task-list" id="taskList"></div>
        <div class="task-hint">Double-tap a name to rename it. Renaming updates your history too.</div>
    </div>

    <div class="task-scrim" onclick="closeMobileSidebar()"></div>

    <div class="header">
        <div class="header-inner">
            <div class="header-top">
                <div class="nav-controls">
                    <button class="task-sidebar-toggle" id="taskSidebarToggle" onclick="toggleMobileSidebar()" aria-label="Activities">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
                    </button>
                    <button class="nav-btn" onclick="changeDate(-1)" aria-label="Previous day">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
                    </button>
                    <div class="date-display" id="currentDate">Today</div>
                    <button class="nav-btn" onclick="changeDate(1)" aria-label="Next day">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
                    </button>
                    <div class="day-count-controls">
                        <button class="day-count-btn" onclick="changeDayCount(-1)" aria-label="Fewer days">−</button>
                        <span class="day-count-label" id="dayCountLabel">1 day</span>
                        <button class="day-count-btn" onclick="changeDayCount(1)" aria-label="More days">+</button>
                    </div>
                </div>
                <div class="score-badge" id="dailyScore">0%</div>
            </div>

        <div class="multipliers" id="multiplierContainer">
            <div class="mult-item" id="itemMomentum">
                <span>Momentum (1.0x)</span>
            </div>
            <label class="mult-item" id="labelRings">
                <input type="checkbox" id="checkRings" onchange="updateStats()">
                <span>Apple Watch (1.2x)</span>
            </label>
            <label class="mult-item" id="labelWeight">
                <input type="checkbox" id="checkWeight" onchange="updateStats()">
                <span>Weight Target (1.3x)</span>
            </label>
        </div>

            <div class="controls" id="presetContainer"></div>

            <div class="graph-section">
                <div class="graph-label">
                    <span class="graph-title">7-day average</span>
                    <div class="graph-window-selectors" id="graphWindowSelectors">
                        <button class="window-btn" data-window="7D">7D</button>
                        <button class="window-btn active" data-window="30D">30D</button>
                        <button class="window-btn" data-window="90D">90D</button>
                        <button class="window-btn" data-window="1Y">1Y</button>
                        <button class="window-btn" data-window="All">All</button>
                    </div>
                    <span class="graph-value" id="currentAvg">0%</span>
                </div>
                <canvas id="progressGraph"></canvas>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="heatmap-container">
            <div class="heatmap-scroll">
                <div class="heatmap-inner">
                    <div class="heatmap-labels" id="heatmapMonthLabels"></div>
                    <div class="heatmap-wrapper">
                        <div class="heatmap-days">
                            <span>Mon</span>
                            <span></span>
                            <span>Wed</span>
                            <span></span>
                            <span>Fri</span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="heatmap-grid" id="heatmapGrid"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid-container" id="grid">
            <div id="timeIndicator"></div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-actions">
            <button class="reset-btn" onclick="clearDay()">Clear this day</button>
            <button class="reset-btn danger" onclick="clearAllData()">Reset everything</button>
        </div>
        <div class="app-version">v<span id="appVersion">1.0.8</span></div>
    </div>

    <script>
        const APP_VERSION = '1.0.8';
        const DEFAULT_ACTIVITIES = ["Sleep", "Code", "Work", "Read", "Workout", "Stretch", "Grooming", "Pray", "Netflix"];
        const START_HOUR = 5;
        const TOTAL_HOURS = 24;
        const SCHEDULE = { 18: "Sleep", 19: "Sleep", 20: "Sleep", 21: "Sleep", 22: "Sleep", 23: "Sleep" };
        const MOMENTUM_MULTIPLIER = 1.5;
        const RINGS_MULTIPLIER = 1.2;
        const WEIGHT_MULTIPLIER = 1.3;
        const HEATMAP_WEEKS = 16; // ~4 months of history, ending with the current week

        let currentViewDate = new Date();
        currentViewDate.setHours(0, 0, 0, 0);

        const DATA_KEY = 'rayane_tracker_v2';
        const STATS_KEY = 'rayane_tracker_stats';
        const TASKS_KEY = 'rayane_tasks';

        let selectedActivity = "Code";
        let dayData = {};
        let dayStats = { rings: false, weight: false };
        let dayCount = parseInt(localStorage.getItem('rayane_day_count')) || 1;
        let graphWindow = localStorage.getItem('rayane_graph_window') || '30D';
        let tasks = []; // Dynamic tasks list

        // A single bad write used to blank the whole app: every read was a bare
        // JSON.parse, and a throw in init() left nothing on screen. Read defensively.
        function readStore(key, fallback = {}) {
            try {
                const parsed = JSON.parse(localStorage.getItem(key));
                return (parsed && typeof parsed === 'object') ? parsed : fallback;
            } catch (err) {
                console.warn(`Could not read ${key}, falling back to empty:`, err);
                return fallback;
            }
        }

        function writeStore(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (err) {
                console.error(`Could not save ${key}:`, err);
            }
        }

        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('dailyScore');
        const dateEl = document.getElementById('currentDate');
        const presetContainer = document.getElementById('presetContainer');

        // Task Management Functions
        function loadTasks() {
            const stored = readStore(TASKS_KEY, null);
            if (Array.isArray(stored) && stored.length) {
                tasks = stored;
            } else {
                // Initialize with default activities
                tasks = DEFAULT_ACTIVITIES.map(name => ({
                    name,
                    protected: name === 'Sleep'
                }));
                saveTasks();
            }
        }

        function saveTasks() {
            writeStore(TASKS_KEY, tasks);
        }

        function getTaskNames() {
            return tasks.map(t => t.name);
        }

        function taskExists(name) {
            return tasks.some(t => t.name.toLowerCase() === name.toLowerCase());
        }

        function addTaskFromInput() {
            const input = document.getElementById('taskAddInput');
            const taskName = input.value.trim();
            const errorMsg = document.getElementById('taskErrorMsg');

            if (!taskName) {
                showTaskError('Task name cannot be empty');
                return;
            }

            if (taskExists(taskName)) {
                showTaskError('Task already exists');
                return;
            }

            addTask(taskName);
            input.value = '';
            hideTaskError();
        }

        function addTask(name) {
            tasks.push({ name, protected: false });
            saveTasks();
            renderTaskSidebar();
            renderPresets();
        }

        function deleteTask(name) {
            const task = tasks.find(t => t.name === name);
            if (task && task.protected) {
                showTaskError('Cannot delete protected task');
                return;
            }

            tasks = tasks.filter(t => t.name !== name);
            saveTasks();

            // Don't leave the picker pointing at a task that no longer exists.
            // Past slots keep the old name on purpose — that history still happened.
            if (selectedActivity === name) {
                selectedActivity = tasks.length ? tasks[0].name : '';
            }

            renderTaskSidebar();
            renderPresets();
            hideTaskError();
        }

        function renameTask(oldName, newName) {
            newName = newName.trim();
            
            if (!newName) {
                showTaskError('Task name cannot be empty');
                return false;
            }

            const task = tasks.find(t => t.name === oldName);
            if (task && task.protected && oldName !== newName) {
                showTaskError('Cannot rename protected task');
                return false;
            }

            if (oldName !== newName && taskExists(newName)) {
                showTaskError('Task already exists');
                return false;
            }

            const index = tasks.findIndex(t => t.name === oldName);
            if (index !== -1) {
                tasks[index].name = newName;
                saveTasks();
                migrateActivityName(oldName, newName);
                hideTaskError();
                return true;
            }
            return false;
        }

        // Renaming a task used to leave the old name on every slot already logged,
        // so history and the task list drifted apart. Rewrite the stored slots too.
        function migrateActivityName(oldName, newName) {
            if (oldName === newName) return;

            const allData = readStore(DATA_KEY);
            let changed = false;

            Object.values(allData).forEach(day => {
                Object.values(day).forEach(slot => {
                    if (slot && slot.activity === oldName) {
                        slot.activity = newName;
                        changed = true;
                    }
                });
            });

            if (changed) writeStore(DATA_KEY, allData);
            if (selectedActivity === oldName) selectedActivity = newName;
        }

        function showTaskError(message) {
            const errorMsg = document.getElementById('taskErrorMsg');
            errorMsg.innerText = message;
            errorMsg.classList.add('show');
            setTimeout(() => hideTaskError(), 3000);
        }

        function hideTaskError() {
            const errorMsg = document.getElementById('taskErrorMsg');
            errorMsg.classList.remove('show');
        }

        function renderTaskSidebar() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            tasks.forEach(task => {
                const item = document.createElement('div');
                item.className = 'task-item';

                const nameEl = document.createElement('span');
                nameEl.className = 'task-item-name' + (task.protected ? ' protected' : '');
                nameEl.innerText = task.name;
                
                if (!task.protected) {
                    nameEl.title = 'Double-click to rename';
                    nameEl.ondblclick = () => renameTaskUI(task.name, nameEl);
                }

                item.appendChild(nameEl);

                const actionsEl = document.createElement('div');
                actionsEl.className = 'task-item-actions';

                if (!task.protected) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'task-item-btn delete';
                    deleteBtn.type = 'button';
                    deleteBtn.setAttribute('aria-label', `Delete ${task.name}`);
                    deleteBtn.appendChild(icon('M18 6L6 18M6 6l12 12', 13));
                    deleteBtn.onclick = () => deleteTask(task.name);
                    actionsEl.appendChild(deleteBtn);
                }

                item.appendChild(actionsEl);
                taskList.appendChild(item);
            });
        }

        function renameTaskUI(oldName, nameEl) {
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldName;
            input.className = 'task-item-name';
            input.style.background = 'var(--bg)';
            input.style.border = '1px solid var(--accent)';
            input.style.color = 'var(--text)';
            input.style.padding = '4px 8px';
            input.style.borderRadius = '4px';

            nameEl.replaceWith(input);
            input.focus();
            input.select();

            const finishRename = () => {
                const newName = input.value.trim();
                if (renameTask(oldName, newName)) {
                    renderTaskSidebar();
                    renderPresets();
                    renderGrid(); // slot labels carry the activity name
                    updateTimeIndicator();
                }
            };

            input.onblur = finishRename;
            input.onkeydown = (e) => {
                if (e.key === 'Enter') finishRename();
                if (e.key === 'Escape') {
                    renderTaskSidebar();
                }
            };
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('taskSidebar');
            const body = document.body;
            sidebar.classList.toggle('visible');
            body.classList.toggle('sidebar-visible');
        }

        function closeMobileSidebar() {
            const sidebar = document.getElementById('taskSidebar');
            const body = document.body;
            sidebar.classList.remove('visible');
            body.classList.remove('sidebar-visible');
        }

        function init() {
            // Display version
            document.getElementById('appVersion').innerText = APP_VERSION;
            console.log(`🚀 Rayane Tracker v${APP_VERSION} loaded`);
            
            loadTasks();
            updateDayCountLabel();
            renderTaskSidebar();
            renderPresets();
            initGraphWindows();
            updateDisplay();
            renderHeatmap();
            setInterval(updateTimeIndicator, 60000);
        }

        function initGraphWindows() {
            const selectors = document.querySelectorAll('.window-btn');
            selectors.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.window === graphWindow);
                btn.onclick = () => {
                    graphWindow = btn.dataset.window;
                    localStorage.setItem('rayane_graph_window', graphWindow);
                    selectors.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderProgressGraph(readStore(DATA_KEY), readStore(STATS_KEY));
                };
            });
        }

        function changeDayCount(delta) {
            dayCount = Math.max(1, Math.min(7, dayCount + delta));
            localStorage.setItem('rayane_day_count', dayCount);
            updateDayCountLabel();
            renderGrid();
            updateTimeIndicator(); // Restore time indicator after grid re-render
        }

        function updateDayCountLabel() {
            const label = document.getElementById('dayCountLabel');
            if (label) label.innerText = dayCount === 1 ? '1 day' : `${dayCount} days`;
        }

        function renderPresets() {
            presetContainer.innerHTML = '';
            const taskNames = getTaskNames();
            taskNames.forEach(name => {
                const btn = document.createElement('button');
                btn.className = `preset-btn ${name === selectedActivity ? 'active' : ''}`;
                btn.innerText = name;
                btn.onclick = () => {
                    selectedActivity = name;
                    closeMobileSidebar();
                    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                presetContainer.appendChild(btn);
            });
        }

        function getDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseDateKey(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function updateDisplay() {
            const key = getDateKey(currentViewDate);
            const formatted = currentViewDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            dateEl.innerHTML = '';
            if (key === getDateKey(new Date())) {
                const today = document.createElement('span');
                today.className = 'date-today';
                today.innerText = 'Today';
                dateEl.appendChild(today);
                dateEl.appendChild(document.createTextNode(` · ${formatted}`));
            } else {
                dateEl.appendChild(document.createTextNode(formatted));
            }

            const allData = readStore(DATA_KEY);
            const allStats = readStore(STATS_KEY);

            if (!allData[key]) {
                allData[key] = {};
                Object.entries(SCHEDULE).forEach(([idx, act]) => {
                    allData[key][idx] = { activity: act, status: 'neutral' };
                });
                writeStore(DATA_KEY, allData);
            }

            dayData = allData[key];
            dayStats = allStats[key] || { rings: false, weight: false };

            document.getElementById('checkRings').checked = dayStats.rings;
            document.getElementById('checkWeight').checked = dayStats.weight;

            // MOMENTUM LOGIC: Average of last 7 days > 50%
            const momentumActive = calculateMomentum(allData, allStats);
            const momentumEl = document.getElementById('itemMomentum');
            if (momentumEl) {
                momentumEl.classList.toggle('active', momentumActive);
                momentumEl.querySelector('span').innerText = momentumActive ? "Momentum Active (1.5x) 🔥" : "Momentum (1.0x)";
            }

            updateMultiplierStyles();
            renderGrid();
            recalculateScore(allData, allStats);
            renderProgressGraph(allData, allStats);
            updateTimeIndicator();
        }

        function updateTimeIndicator() {
            const indicator = document.getElementById('timeIndicator');
            if (!indicator) return;

            const now = new Date();
            // Check if "Today" is visible in the current view
            // currentViewDate is the start. We show dayCount days.
            const todayKey = getDateKey(now);
            let todayIndex = -1;

            for (let d = 0; d < dayCount; d++) {
                const targetDate = new Date(currentViewDate);
                targetDate.setDate(targetDate.getDate() + d);
                if (getDateKey(targetDate) === todayKey) {
                    todayIndex = d;
                    break;
                }
            }

            if (todayIndex === -1) {
                indicator.style.display = 'none';
                return;
            }

            const hoursSinceStart = (now.getHours() + now.getMinutes() / 60 - START_HOUR + 24) % 24;
            const rowHeight = gridEl.scrollHeight / TOTAL_HOURS;
            const topOffset = hoursSinceStart * rowHeight;

            // Measure the time column rather than assuming a hardcoded width —
            // it differs per breakpoint and used to be wrong on small screens.
            const timeCol = gridEl.querySelector('.time-slot');
            const timeW = timeCol ? timeCol.getBoundingClientRect().width : 68;

            indicator.style.display = 'block';
            indicator.style.top = `${topOffset}px`;
            indicator.style.left = `calc(${timeW}px + ((100% - ${timeW}px) / ${dayCount}) * ${todayIndex})`;
            indicator.style.width = `calc((100% - ${timeW}px) / ${dayCount})`;
        }

        // How many days each window plots, counting back from today. These are
        // genuine trailing ranges now — the labels used to say 7D/30D/90D but
        // select this calendar week/month/quarter, so on the 1st of a month
        // "30D" drew a single point.
        const GRAPH_WINDOWS = { '7D': 7, '30D': 30, '90D': 90, '1Y': 365 };
        const ROLLING_DAYS = 7;

        // Earliest day that has any real activity. Replaces a hardcoded
        // Dec 21 2025 constant, which was arbitrary and wrong for anyone whose
        // history starts anywhere else.
        function getFirstDataDate(allData, allStats) {
            const keys = new Set([...Object.keys(allData), ...Object.keys(allStats)]);
            let earliest = null;

            keys.forEach(k => {
                if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
                if (!hasDayActivity(k, allData, allStats)) return;
                if (!earliest || k < earliest) earliest = k;
            });

            return earliest ? parseDateKey(earliest) : null;
        }

        // Trailing ROLLING_DAYS-day mean of the days that have activity. A
        // cumulative-since-day-one average cannot move once you have a few
        // months of history — this one responds to the week you actually had.
        function buildSeries(allData, allStats, from, to) {
            const series = [];
            const recent = [];
            const cursor = new Date(from);

            while (cursor <= to) {
                const k = getDateKey(cursor);
                const active = hasDayActivity(k, allData, allStats);
                const score = active ? getDayScore(k, allData, allStats) : null;

                if (active) {
                    recent.push(score);
                    if (recent.length > ROLLING_DAYS) recent.shift();
                }

                series.push({
                    date: new Date(cursor),
                    score,
                    rolling: recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : null,
                });

                cursor.setDate(cursor.getDate() + 1);
            }

            return series;
        }

        function renderProgressGraph(allData, allStats) {
            const canvas = document.getElementById('progressGraph');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            if (!rect.width) return;

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const w = rect.width;
            const h = rect.height;
            const padTop = 6;
            const padBottom = 14;
            const chartH = h - padTop - padBottom;

            ctx.clearRect(0, 0, w, h);

            const avgEl = document.getElementById('currentAvg');
            const firstData = getFirstDataDate(allData, allStats);

            if (!firstData) {
                avgEl.innerText = '—';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
                ctx.font = '12px -apple-system, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Log an hour to start tracking', w / 2, h / 2);
                return;
            }

            // Anchor on the day being viewed so scrolling back in time shows the
            // chart as it stood then.
            const anchor = new Date(currentViewDate);
            anchor.setHours(0, 0, 0, 0);

            const span = GRAPH_WINDOWS[graphWindow];
            let chartStart;
            if (span) {
                chartStart = new Date(anchor);
                chartStart.setDate(chartStart.getDate() - (span - 1));
                if (chartStart < firstData) chartStart = new Date(firstData);
            } else {
                chartStart = new Date(firstData);
            }

            // The rolling mean needs the days before the window to be correct at
            // its left edge, so build from the start of history and slice.
            const full = buildSeries(allData, allStats, firstData, anchor);
            const series = full.filter(p => p.date >= chartStart);
            if (!series.length) return;

            const latest = [...full].reverse().find(p => p.rolling !== null);
            avgEl.innerText = latest ? Math.round(latest.rolling * 100) + '%' : '—';

            const n = series.length;
            const stepX = n > 1 ? w / (n - 1) : 0;
            const xAt = (i) => (n > 1 ? i * stepX : w / 2);
            const yAt = (v) => padTop + chartH - v * chartH;

            // Baseline + 50% guide
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 1;
            [0, 0.5, 1].forEach(v => {
                const y = Math.round(yAt(v)) + 0.5;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            });

            // Daily scores as bars behind the line — gives the chart texture
            // instead of one lonely stroke in an empty box.
            const barW = Math.max(1.5, Math.min(9, stepX * 0.55));
            series.forEach((p, i) => {
                if (p.score === null || p.score <= 0) return;
                const x = xAt(i) - barW / 2;
                const y = yAt(p.score);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
                ctx.fillRect(x, y, barW, padTop + chartH - y);
            });

            // Rolling average line, broken across gaps with no data
            const grad = ctx.createLinearGradient(0, padTop, 0, padTop + chartH);
            grad.addColorStop(0, 'rgba(10, 132, 255, 0.28)');
            grad.addColorStop(1, 'rgba(10, 132, 255, 0)');

            let run = [];
            const flush = () => {
                if (run.length < 1) { run = []; return; }

                if (run.length > 1) {
                    ctx.beginPath();
                    run.forEach(([x, y], idx) => (idx ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
                    ctx.lineTo(run[run.length - 1][0], padTop + chartH);
                    ctx.lineTo(run[0][0], padTop + chartH);
                    ctx.closePath();
                    ctx.fillStyle = grad;
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.strokeStyle = '#0A84FF';
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                run.forEach(([x, y], idx) => (idx ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
                ctx.stroke();
                run = [];
            };

            series.forEach((p, i) => {
                if (p.rolling === null) { flush(); return; }
                run.push([xAt(i), yAt(p.rolling)]);
            });
            flush();

            // Marker on the most recent point that has a value
            for (let i = series.length - 1; i >= 0; i--) {
                if (series[i].rolling === null) continue;
                const x = xAt(i);
                const y = yAt(series[i].rolling);
                ctx.beginPath();
                ctx.arc(x, y, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = '#0A84FF';
                ctx.fill();
                ctx.strokeStyle = '#08080A';
                ctx.lineWidth = 2;
                ctx.stroke();
                break;
            }

            // Date ticks: first, last, and a couple in between
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = '10px -apple-system, system-ui, sans-serif';
            ctx.textBaseline = 'alphabetic';
            const tickCount = Math.min(4, n);
            for (let t = 0; t < tickCount; t++) {
                const i = Math.round((t / Math.max(tickCount - 1, 1)) * (n - 1));
                const d = series[i].date;
                const label = n <= 14
                    ? d.toLocaleDateString('en-US', { weekday: 'short' })
                    : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                ctx.textAlign = t === 0 ? 'left' : (t === tickCount - 1 ? 'right' : 'center');
                ctx.fillText(label, xAt(i), h - 2);
            }
        }

        // ─── Scoring ──────────────────────────────────────────────────────────
        // One definition, used by the badge, the graph and the heatmap alike.
        // These three used to disagree, which is why momentum and the chart
        // could show different numbers for the same day.

        // A day only counts once something actually happened on it. Opening a
        // date seeds an empty sleep block in storage, and that must never be
        // mistaken for a logged 0% day.
        function hasDayActivity(key, allData, allStats) {
            const stats = allStats[key] || {};
            if (stats.rings || stats.weight) return true;

            const slots = allData[key] ? Object.values(allData[key]) : [];
            return slots.some(s => s && (s.status === 'done' || s.status === 'fail'));
        }

        function countDone(key, allData) {
            if (!allData[key]) return 0;
            return Object.values(allData[key]).filter(s => s && s.status === 'done').length;
        }

        function calculateScoreValue(doneCount, stats = {}, momentumActive = false) {
            let score = doneCount / TOTAL_HOURS;

            if (momentumActive) score *= MOMENTUM_MULTIPLIER;
            if (stats.rings) score *= RINGS_MULTIPLIER;
            if (stats.weight) score *= WEIGHT_MULTIPLIER;

            // Stacked multipliers reach 2.34x, so this is a real ceiling, not a
            // formality. Without it the chart line clamped but the printed
            // average didn't, and the two silently disagreed.
            return Math.max(0, Math.min(score, 1));
        }

        // Score before momentum is applied. Momentum is derived from these, so it
        // cannot itself depend on momentum — that's what keeps this non-recursive.
        function getBaseScore(key, allData, allStats) {
            return calculateScoreValue(countDone(key, allData), allStats[key] || {}, false);
        }

        // Momentum: of the 7 days before referenceDate, the ones with real
        // activity average above 50%.
        function calculateMomentum(allData, allStats, referenceDate = currentViewDate) {
            let totalPercent = 0;
            let daysCount = 0;

            for (let i = 1; i <= 7; i++) {
                const d = new Date(referenceDate);
                d.setDate(d.getDate() - i);
                const k = getDateKey(d);

                if (!hasDayActivity(k, allData, allStats)) continue;
                totalPercent += getBaseScore(k, allData, allStats);
                daysCount++;
            }

            if (daysCount === 0) return false;
            return (totalPercent / daysCount) > 0.5;
        }

        // The final score for a day, momentum included.
        function getDayScore(key, allData, allStats) {
            if (!hasDayActivity(key, allData, allStats)) return 0;
            const momentumActive = calculateMomentum(allData, allStats, parseDateKey(key));
            return calculateScoreValue(countDone(key, allData), allStats[key] || {}, momentumActive);
        }

        function updateMultiplierStyles() {
            document.getElementById('labelRings').classList.toggle('active', dayStats.rings);
            document.getElementById('labelWeight').classList.toggle('active', dayStats.weight);
        }

        // Small inline-SVG helper. The UI used to lean on text glyphs (☰ ✕ 🔒),
        // which render differently per platform and read as placeholder art.
        function icon(path, size = 14) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '2');
            svg.setAttribute('stroke-linecap', 'round');
            svg.setAttribute('stroke-linejoin', 'round');

            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', path);
            svg.appendChild(p);
            return svg;
        }

        function setSlotContent(slot, saved) {
            slot.innerHTML = '';

            if (!saved) {
                return;
            }

            const content = document.createElement('div');
            content.className = 'task-slot-content';
            const label = document.createElement('span');
            label.innerText = saved.activity;
            content.appendChild(label);
            slot.appendChild(content);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'task-slot-delete';
            deleteBtn.type = 'button';
            deleteBtn.setAttribute('aria-label', `Delete ${saved.activity}`);
            deleteBtn.appendChild(icon('M18 6L6 18M6 6l12 12', 11));
            slot.appendChild(deleteBtn);
        }

        function refreshViewsAfterDataChange(allData) {
            dayData = allData[getDateKey(currentViewDate)] || {};

            const allStats = readStore(STATS_KEY);

            // Momentum can flip on any edit, so refresh the badge with it.
            const momentumActive = calculateMomentum(allData, allStats);
            const momentumEl = document.getElementById('itemMomentum');
            if (momentumEl) {
                momentumEl.classList.toggle('active', momentumActive);
                momentumEl.querySelector('span').innerText = momentumActive ? "Momentum Active (1.5x) 🔥" : "Momentum (1.0x)";
            }

            recalculateScore(allData, allStats);
            renderProgressGraph(allData, allStats);
            renderHeatmap();
        }

        function deleteSlot(dayKey, index) {
            const allData = readStore(DATA_KEY);
            if (!allData[dayKey] || !allData[dayKey][index]) {
                return;
            }

            delete allData[dayKey][index];
            writeStore(DATA_KEY, allData);
            renderGrid();
            updateTimeIndicator();
            refreshViewsAfterDataChange(allData);
        }

        function renderGrid() {
            gridEl.innerHTML = '';

            // Set dynamic columns for multi-day
            gridEl.style.setProperty('--day-count', dayCount);
            if (dayCount > 1) {
                gridEl.classList.add('multi-day');
            } else {
                gridEl.classList.remove('multi-day');
            }

            // Re-create time indicator since innerHTML cleared it
            const indicatorVal = document.createElement('div');
            indicatorVal.id = 'timeIndicator';
            gridEl.appendChild(indicatorVal);

            const allData = readStore(DATA_KEY);

            for (let i = 0; i < TOTAL_HOURS; i++) {
                const hour = (START_HOUR + i) % 24;
                const suffix = hour >= 12 ? 'PM' : 'AM';
                const dispH = hour % 12 || 12;

                const tDiv = document.createElement('div');
                tDiv.className = 'time-slot';
                tDiv.innerText = `${dispH} ${suffix}`;
                gridEl.appendChild(tDiv);

                // Render slots for each day
                for (let d = 0; d < dayCount; d++) {
                    const targetDate = new Date(currentViewDate);
                    targetDate.setDate(targetDate.getDate() + d);
                    const dayKey = getDateKey(targetDate);
                    const dayDataForSlot = allData[dayKey] || {};

                    const slot = document.createElement('div');
                    slot.className = 'task-slot';

                    // Highlight Today column
                    const nowKey = getDateKey(new Date());
                    if (dayKey === nowKey) {
                        slot.classList.add('today-column');
                    }

                    const saved = dayDataForSlot[i];
                    if (saved) {
                        setSlotContent(slot, saved);
                        if (saved.status === 'neutral') slot.classList.add('status-neutral');
                        if (saved.status === 'done') slot.classList.add('status-completed');
                        if (saved.status === 'fail') slot.classList.add('status-failed');

                        const deleteBtn = slot.querySelector('.task-slot-delete');
                        deleteBtn.onclick = (event) => {
                            event.stopPropagation();
                            deleteSlot(dayKey, i);
                        };
                    }
                    slot.onclick = () => handleSlotClickMulti(slot, i, dayKey);
                    gridEl.appendChild(slot);
                }
            }
        }

        function handleSlotClickMulti(el, index, dayKey) {
            let status = 'empty';
            if (el.classList.contains('status-neutral')) status = 'neutral';
            else if (el.classList.contains('status-completed')) status = 'done';
            else if (el.classList.contains('status-failed')) status = 'fail';

            el.classList.remove('status-neutral', 'status-completed', 'status-failed', 'pop-anim');
            void el.offsetWidth;
            el.classList.add('pop-anim');

            const allData = readStore(DATA_KEY);
            if (!allData[dayKey]) allData[dayKey] = {};

            if (status === 'empty') {
                setSlotContent(el, { activity: selectedActivity, status: 'neutral' });
                el.classList.add('status-neutral');
                allData[dayKey][index] = { activity: selectedActivity, status: 'neutral' };
            } else if (status === 'neutral') {
                el.classList.add('status-completed');
                allData[dayKey][index] = { activity: allData[dayKey][index].activity, status: 'done' };
            } else if (status === 'done') {
                el.classList.add('status-failed');
                allData[dayKey][index] = { activity: allData[dayKey][index].activity, status: 'fail' };
            } else {
                setSlotContent(el, null);
                delete allData[dayKey][index];
            }

            writeStore(DATA_KEY, allData);
            refreshViewsAfterDataChange(allData);
        }

        function renderHeatmap() {
            const heatmapEl = document.getElementById('heatmapGrid');
            const labelsEl = document.getElementById('heatmapMonthLabels');
            if (!heatmapEl || !labelsEl) return;

            heatmapEl.innerHTML = '';
            labelsEl.innerHTML = '';

            // Both grids flow into fixed --heat-cell columns, so the month
            // labels stay locked to the weeks they describe however many
            // weeks HEATMAP_WEEKS renders.

            const allData = readStore(DATA_KEY);
            const allStats = readStore(STATS_KEY);

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayKey = getDateKey(today);

            // Monday of the current week
            const currentMon = new Date(today);
            const dow = currentMon.getDay();
            currentMon.setDate(currentMon.getDate() - (dow === 0 ? 6 : dow - 1));

            // Start HEATMAP_WEEKS - 1 weeks earlier so the grid *ends* with the
            // current week. It used to start here and run forward, so the whole
            // chart was empty future days and no history ever showed up.
            const startRenderDate = new Date(currentMon);
            startRenderDate.setDate(startRenderDate.getDate() - (HEATMAP_WEEKS - 1) * 7);

            let lastMonthLabel = -1;

            for (let w = 0; w < HEATMAP_WEEKS; w++) {
                // Check for month label on the first week of a month
                const weekDate = new Date(startRenderDate);
                weekDate.setDate(weekDate.getDate() + (w * 7));

                const label = document.createElement('span');
                // Only show label if month changes, OR if it's the first column
                // AND don't spam labels if weeks are in same month
                if (weekDate.getMonth() !== lastMonthLabel) {
                    label.innerText = weekDate.toLocaleDateString('en-US', { month: 'short' });
                    lastMonthLabel = weekDate.getMonth();
                } else {
                    label.innerText = ""; // Spacer
                }
                labelsEl.appendChild(label);

                // Loop 7 days (Mon-Sun)
                for (let d = 0; d < 7; d++) {
                    const cellDate = new Date(startRenderDate);
                    cellDate.setDate(cellDate.getDate() + (w * 7) + d);
                    const k = getDateKey(cellDate);

                    const cell = document.createElement('div');
                    cell.className = 'heatmap-cell';

                    if (k === todayKey) {
                        cell.classList.add('today');
                    }

                    if (cellDate > today) {
                        // Days that haven't happened yet — dim, no score to show.
                        cell.classList.add('future');
                        cell.title = `${cellDate.toLocaleDateString()} (upcoming)`;
                    } else {
                        const score = getDayScore(k, allData, allStats);
                        cell.title = `${cellDate.toLocaleDateString()} — ${Math.round(score * 100)}%`;

                        if (score > 0) {
                            // One hue at five intensities, not a red→green hue
                            // sweep. The sweep put every realistic day (40-70%)
                            // at hue ~60, so the whole chart came out yellow and
                            // solid green needed a literal 100% day.
                            cell.classList.add(`level-${Math.min(5, Math.ceil(score * 5))}`);
                        }
                    }

                    cell.onclick = () => {
                        currentViewDate = new Date(cellDate);
                        updateDisplay();
                    };

                    heatmapEl.appendChild(cell);
                }
            }
        }

        function updateStats() {
            dayStats.rings = document.getElementById('checkRings').checked;
            dayStats.weight = document.getElementById('checkWeight').checked;

            const key = getDateKey(currentViewDate);
            const allStats = readStore(STATS_KEY);
            allStats[key] = dayStats;
            writeStore(STATS_KEY, allStats);

            updateDisplay();
        }

        function recalculateScore(allData, allStats) {
            const score = getDayScore(getDateKey(currentViewDate), allData, allStats);

            const percent = Math.round(score * 100);
            scoreEl.innerText = percent + "%";
            scoreEl.style.color = (percent >= 80) ? "var(--green)" : (percent >= 50 ? "white" : "var(--red)");
        }

        function changeDate(days) {
            currentViewDate.setDate(currentViewDate.getDate() + days);
            updateDisplay();
        }

        function clearDay() {
            const key = getDateKey(currentViewDate);
            const allData = readStore(DATA_KEY);
            const allStats = readStore(STATS_KEY);

            // Remove day-specific data
            delete allStats[key];
            delete allData[key];

            // Save updates
            writeStore(DATA_KEY, allData);
            writeStore(STATS_KEY, allStats);

            // Refresh UI without reloading page (preserves currentViewDate)
            updateDisplay();
            renderHeatmap();
        }

        function clearAllData() {
            if (confirm("Are you sure you want to delete ALL history? This cannot be undone.")) {
                localStorage.removeItem(DATA_KEY);
                localStorage.removeItem(STATS_KEY);
                localStorage.removeItem('rayane_day_count');
                localStorage.removeItem('rayane_graph_window');
                location.reload();
            }
        }

        init();

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);

                        // Auto-reload when a new SW takes control (picks up updates on iPhone)
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            window.location.reload();
                        });

                        // If a new SW is waiting, skip waiting to activate it immediately
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed:', err);
                    });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Show install button (optional - can add UI for this later)
            console.log('PWA install prompt available');
        });

        // Track if app was launched from home screen
        if (window.matchMedia('(display-mode: standalone)').matches) {
            console.log('Running as installed PWA');
        }
    </script>
</body>
